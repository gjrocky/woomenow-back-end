<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="x-apple-disable-message-reformatting"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="color-scheme" content="light dark"/>
    <meta name="supported-color-schemes" content="light dark"/>
    <title>{{ subject }}</title>
    <style type="text/css" rel="stylesheet" media="all">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #cccccc;
            margin: 0;
        }

        a {
            text-decoration: none;
        }

        table {
            border-spacing: 0;
        }

        td {
            padding: 0;
        }

        img {
            border: 0;
        }

        p {
            margin: 0;
        }

        .email-body h1 {
            padding: 40px 0px !important;
            font-size: 23px !important;
            font-weight: bold !important;
            line-height: 28px !important;
            color: #ffffff !important;
        }

        .email-body h2 {
            padding: 30px 0px !important;
            font-size: 18px !important;
            font-weight: bold !important;
            line-height: 28px !important;
            color: #ffffff !important;
        }

        .email-body p {
            padding-bottom: 24px !important;
            font-weight: 400 !important;
            font-size: 16px !important;
            line-height: 24px !important;
            color: #ffffff !important;
        }

        .email-body ul {
            padding: 0 0 24px 0 !important;
            margin: 0 !important;
        }

        .email-body ul li {
            display: flex !important;
            align-items: center !important;
            padding-bottom: 12px !important;
            font-size: 16px !important;
            line-height: 24px !important;
            color: #ffffff !important;
        }

        .email-body ol li {
            padding-bottom: 12px !important;
            font-size: 16px !important;
            color: #ffffff !important;
            line-height: 24px !important;
        }

        .email-body ul li::before {
            content: "";
            background-image: url({{ icon }});
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            width: 20px;
            height: 20px;
            margin-right: 8px !important;
        }

        .email-body a {
            padding: 12px 16px !important;
            background: linear-gradient(
                    45deg,
                    #fc33ff 0%,
                    #6b00f5 100%
            ) !important;
            display: inline-block !important;
            font-weight: 400 !important;
            font-size: 16px !important;
            line-height: 24px !important;
            color: #ffffff !important;
        {#margin-bottom: 24px !important;#}
        }


        @media (max-width: 576px) {
            body,
            table,
            td,
            a {
                -webkit-text-size-adjust: none !important;
            }

            .main-heading {
                font-size: 18px !important;
                padding: 24px 0 !important;
                line-height: 22px !important;
            }

            .main-content {
                padding: 16px !important;
            }

            .main-sub-content {
                padding: 16px 0 0 !important;
            }

            .sub-content {
                padding: 20px !important;
            }

            .sub-info {
                font-size: 14px !important;
                padding-bottom: 16px !important;
                line-height: 20px !important;
            }

            .content {
                font-size: 14px !important;
            }

            .btn-info {
                font-size: 14px !important;
                padding: 10px 14px !important;
                display: block !important;
                width: 100% !important;
                max-width: max-content !important;
            }

            .main-sub-info {
                width: 100% !important;
                max-width: 100% !important;
            }

            table {
                width: 100% !important;
                max-width: 100% !important;
                table-layout: fixed !important;
            }

            a {
                word-wrap: break-word !important;
                word-break: break-word !important;
                overflow-wrap: break-word !important;
                white-space: normal !important;
                display: block !important;
            }

            .content-wrapper {
                padding-bottom: 16px !important;
            }
        }
    </style>
</head>
<body>
<div
        class="main-content"
        style="background-color: #0f172a; padding: 32px; table-layout: fixed"
>
    <table
            style="
          background: transparent;
          margin: 0 auto;
          border-spacing: 0;
          font-family: manrope, sans-serif;
        "
            align="center"
    >
        <tbody>
        <tr>
            <td>
                <table
                        class="main-sub-info"
                        align="center"
                        style="width: 100%; max-width: 592px"
                >
                    <tbody>
                    <tr>
                        <td
                                class="sub-content"
                                style="
                        background-color: #1e293b;
                        box-shadow: 0 4px 8px 0 #00000029;
                        padding: 40px;
                      "
                        >
                            <table align="left">
                                <tbody>
                                <tr>
                                    <td style="padding-bottom: 24px">
                                        <a
                                                href="{{ front_end_link }}"
                                                style="display: inline-block"
                                        >
                                            <img
                                                    style="
                                    width: 100%;
                                    max-width: 98px;
                                    height: auto;
                                    display: block;
                                  "
                                                    src="{{ logo }}"
                                                    alt="woomenow logo"
                                            />
                                        </a>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="email-body">
                                        {{ email_body|safe }}
                                        {{ email_middle|safe }}
                                        {{ email_lower|safe }}
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td class="main-sub-content" style="padding: 32px 40px 0">
                            <table align="center">
                                <tr>
                                    <td
                                            style="
                              color: #94a3b8;
                              font-weight: 400;
                              font-size: 12px;
                              line-height: 18px;
                            "
                                    >
                                        Questions or concerns? Get in touch with us at
                                        <a
                                                href="mailto:{{ contact_email }}"
                                                style="color: #9a4aff"
                                        >contact@woomenow.com</a
                                        >
                                        or
                                        <a
                                                href="tel:{{ contact_phone_number }}"
                                                style="color: #9a4aff"
                                        >123-456-7890</a
                                        >.
                                    </td>
                                </tr>
                                <tr>
                                    <td
                                            style="
                              color: #94a3b8;
                              font-weight: 400;
                              font-size: 12px;
                              line-height: 18px;
                            "
                                    >
                                        Never miss a beat! Follow us on
                                        <a href="{{ fb_link }}" style="color: #9a4aff"
                                        >Facebook</a
                                        >
                                        and
                                        <a href="{{ ig_link }}" style="color: #9a4aff">
                                            Instagram</a
                                        >.
                                    </td>
                                </tr>
                                <tr>
                                    <td
                                            class="main-sub-content"
                                            style="
                              color: #94a3b8;
                              font-weight: 400;
                              font-size: 12px;
                              line-height: 18px;
                              padding-top: 24px;
                            "
                                    >
                                        Don’t want any more emails from WooMeNow?
                                        <a href="{{ unsubscribe }}" style="color: #9a4aff"
                                        >Unsubscribe</a
                                        >.
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
